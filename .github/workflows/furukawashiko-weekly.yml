# Refresh the Furukawashiko new-arrivals row on the homepage every Friday night.
# Furukawashiko's shop doesn't answer Cloudflare's servers, so the site can't fetch it live;
# this job fetches it from GitHub instead, updates data/furukawashiko-new.json and pushes,
# which triggers a Cloudflare Pages redeploy. No commit when nothing changed.

name: Furukawashiko weekly new arrivals

on:
  schedule:
    - cron: '0 12 * * 5'   # Friday 12:00 UTC = 21:00 JST/KST
  workflow_dispatch:        # "Run workflow" button for a manual refresh

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch new arrivals
        run: npx --yes tsx@4 scripts/update-furukawashiko.ts

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/furukawashiko-new.json; then
            echo "No change this week"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/furukawashiko-new.json
          git commit -m "Furukawashiko new arrivals: weekly refresh"
          git push
